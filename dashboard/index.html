    <!-- Datageo Auth Referer Gate -->
    <script>
      (function () {
        try {
          var ALLOWED = ['datageoparana.github.io'];
          var ROOT = 'https://datageoparana.github.io/';
          var KEY = 'dg_dashboard_pass';
          if (sessionStorage.getItem(KEY) === '1') return;
          var refHost = '';
          try { refHost = new URL(document.referrer || '').host; } catch (e) {}
          if (refHost && (refHost === location.host || ALLOWED.indexOf(refHost) !== -1)) {
            sessionStorage.setItem(KEY, '1');
            return;
          }
          location.replace(ROOT + '?from=' + encodeURIComponent(location.host + location.pathname));
        } catch (e) {}
      })();
    </script>

    </script>
<!-- Analytics -->
    <script>
      (function() {
        var trackingUrl = '%VITE_TRACKING_URL%';
        if (!trackingUrl || trackingUrl.includes('VITE_TRACKING_URL')) return;
        var key = 'dg_tracked_' + location.pathname;
        if (sessionStorage.getItem(key)) return;
        sessionStorage.setItem(key, '1');
        try {
          fetch(trackingUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              origin: location.origin,
              page: location.pathname,
              referrer: document.referrer || 'direto',
              timestamp: new Date().toISOString(),
              screenWidth: screen.width,
              screenHeight: screen.height,
              language: navigator.language,
              isMobile: /Mobile|Android|iPhone/i.test(navigator.userAgent)
            }),
            keepalive: true
          }).catch(function() {});
        } catch(e) {}
      })();
    </script>
